[workspace]
members = [
    "crates/mcp-core",
    "crates/mcp-http",
    "crates/mcp-platform",
    "crates/mcp-runtime",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
mcp-core = { path = "crates/mcp-core" }
mcp-http = { path = "crates/mcp-http" }
mcp-platform = { path = "crates/mcp-platform" }
mcp-runtime = { path = "crates/mcp-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
url = "2"
keyring = "3"
dirs = "6"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
