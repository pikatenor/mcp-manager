[workspace]
members = [
    "crates/mcp-core",
    "crates/mcp-http",
    "crates/mcp-platform",
    "crates/mcp-runtime",
    "apps/desktop",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
mcp-core = { path = "crates/mcp-core" }
mcp-http = { path = "crates/mcp-http" }
mcp-platform = { path = "crates/mcp-platform" }
mcp-runtime = { path = "crates/mcp-runtime" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
async-trait = "0.1"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
rand = "0.9"
url = "2"
keyring = "3"
dirs = "6"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls"] }
rmcp = { version = "3", default-features = false, features = [
    "auth",
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
oauth2 = "5"
futures = "0.3"
sse-stream = "0.2"
