name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="$(awk '/^\[workspace\.package\]/{in_tbl=1; next} /^\[/{in_tbl=0} in_tbl && $1=="version"{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${ver}; bump Cargo.toml before tagging" >&2
            exit 1
          fi

  build-macos:
    needs: check
    runs-on: macos-15 # arm64 runner; host triple is aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x apps/desktop/bundle-macos.sh && apps/desktop/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-manager-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: target/release/bundle/dmg/*.dmg
