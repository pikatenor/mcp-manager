name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="$(awk '/^\[workspace\.package\]/{in_tbl=1; next} /^\[/{in_tbl=0} in_tbl && $1=="version"{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${ver}; bump Cargo.toml before tagging" >&2
            exit 1
          fi

  build-macos:
    needs: check
    runs-on: macos-15 # arm64 runner; host triple is aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: chmod +x apps/desktop/bundle-macos.sh && apps/desktop/bundle-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-manager-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: target/release/bundle/dmg/*.dmg
